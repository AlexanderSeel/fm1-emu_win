# The plugin's release: on a tag plugin-v<version> (the version in crates/fm1-plugin/Cargo.toml),
# build the AU, VST3 and CLAP on an Apple silicon runner, test and validate them, and publish a
# GitHub Release with the zip (tools/package_plugin.sh). Run by hand (workflow_dispatch), it
# builds and keeps the zip as the run's artifact, without a release.
#
# Signed and notarized when these repository secrets exist; unsigned otherwise:
#   MACOS_CERTIFICATE           a "Developer ID Application" certificate (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization (an app-specific password)

name: Plugin release

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tools
        run: brew install ninja

      - name: The tag names the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -nE 's/^version = "(.*)"/\1/p' crates/fm1-plugin/Cargo.toml | head -1)
          test "plugin-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, crate $v"; exit 1; }

      - name: Signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "no certificate: an unsigned build"; exit 0; fi
          kc=$RUNNER_TEMP/build.keychain-db
          pw=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -nE 's/.*"(Developer ID Application[^"]*)".*/\1/p' | head -1)
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      # The machine's thread: a stamped note on time, a screen with no audio taken (Felucca,
      # from its author's site).
      - name: Tests
        run: |
          node tools/fetch_firmwares.mjs felucca
          cd crates/fm1-plugin && cargo test --release

      - name: Build, install, Apple's AU validator
        run: tools/build_plugin.sh

      - name: Steinberg's VST3 validator
        run: |
          cd target/plugin
          XCODE_VERSION=16.0 cmake -S build/cpm/vst3sdk -B vst3sdk-build -G Ninja -DXCODE_VERSION=16.0 \
            -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build vst3sdk-build --target validator
          vst3sdk-build/bin/Release/validator ~/Library/Audio/Plug-Ins/VST3/FM-1.vst3

      - name: Package (notarized when the secrets exist)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package_plugin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fm1-plugin
          path: target/plugin/release/*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#plugin-v}
          gh release create "$GITHUB_REF_NAME" target/plugin/release/*.zip \
            --title "FM-1 plugin $v (AU, VST3, CLAP)" --notes-file target/plugin/release/notes.md
